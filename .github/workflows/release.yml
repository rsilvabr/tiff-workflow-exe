# Builds the release zip on GitHub's own Windows machine, from the code of the
# commit or tag being built, and records a build attestation for the zip and
# tiff-workflow.exe. Anyone can then check that a file came from here:
#
#   gh attestation verify tiff-workflow-<version>-x64.zip --repo rsilvabr/tiff-workflow-exe
#
# A pushed tag (vX.Y.Z-exeN) also creates a DRAFT release with the zip; the
# real-photo battery runs against that zip before it is published (it needs
# the author's photos, so it cannot run here). Run by hand (Actions tab, "Run
# workflow"), it only builds and keeps the zip as a run artifact.

name: Build release

on:
  push:
    tags: ["v*-exe*"]
  workflow_dispatch:

permissions:
  contents: write       # create the draft release
  id-token: write       # sign the attestation
  attestations: write   # store it

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Version (build.py)
        id: version
        shell: pwsh
        run: |
          $b = Get-Content build.py -Raw
          $tag = [regex]::Match($b, 'TIFFWORKFLOW_TAG = "([^"]+)"').Groups[1].Value
          $rev = [regex]::Match($b, 'PACKAGE_REVISION = (\d+)').Groups[1].Value
          "release=$tag-exe$rev" >> $env:GITHUB_OUTPUT

      - name: The tag matches build.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ("${{ steps.version.outputs.release }}" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but build.py makes ${{ steps.version.outputs.release }}" }

      - name: Build (build.py)
        run: python build.py

      - name: Unit tests
        run: |
          python -m pip install --quiet --disable-pip-version-check pytest
          python -m pytest tests -q --ignore=tests/battery_on_exe.py

      - name: The program starts (wizard help, a backend run by the program itself)
        shell: pwsh
        run: |
          $exe = (Get-Item dist\*\tiff-workflow.exe).FullName
          $help = & $exe --help
          if ($LASTEXITCODE -ne 0 -or -not ($help -match 'TIFF Workflow Manager')) { throw "--help failed: $help" }
          $empty = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'empty [x]')
          & $exe thumbnails --input-dir $empty.FullName --dry-run
          if ($LASTEXITCODE -ne 0) { throw "thumbnails exited $LASTEXITCODE" }
          # The command line of v3.0.0 is refused (exit code 2) since tiff-workflow v3.1.
          & $exe thumbnails -InputDir $empty.FullName -DryRun
          if ($LASTEXITCODE -ne 2) { throw "the old command line exited $LASTEXITCODE, not 2" }
          exit 0   # the runner ends a pwsh step with $LASTEXITCODE, the 2 expected above

      - name: SHA-256
        shell: pwsh
        run: Get-FileHash dist\*.zip, dist\*\tiff-workflow.exe | Format-Table Hash, Path -AutoSize -Wrap

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*/tiff-workflow.exe

      - uses: actions/upload-artifact@v7
        with:
          name: tiff-workflow-exe-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-Item dist\*.zip).FullName --draft --verify-tag `
            --title "${{ github.ref_name }}" `
            --notes "Built by GitHub Actions from ${{ github.sha }}. Notes to follow."
